    //      gradle.properties 里写 android.suppressUnsupportedCompileSdk=36，否则
    //      AGP 会直接报错（见该文件注释）。
    //    · androidx.core 1.16.0 的 AAR metadata 要求 compileSdk ≥ 35，material 1.14.0
    //      又把 core 拉到 1.16.0 ⇒ compileSdk 36 是升库的硬前提，不是顺手改的。
    compileSdk 36
    // ⚠️ 必须显式钉版本：AGP 8.1.0 的默认 build-tools 是 **33.0.1**，而本机 toolchain
    //    里的 33.0.1 缺 `core-lambda-stubs.jar` 等文件（工作区精简时被删）→ AGP 直接报
    //    「Installed Build Tools revision 33.0.1 is corrupted」。
    //    【code 1025】34.0.0 → **36.0.0**：compileSdk 36 的 resources.arsc 要用同代 aapt2
    //    解析，跨代（34 的 aapt2 链 android-36）在 link 阶段会报资源表版本不认识。
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "io.github.ariinyume.dlsitesoundfloat"
        minSdk 24
        // 【code 1025】targetSdk 34 → 36（Android 16）。⚠️ 35+ 起系统**强制** edge-to-edge，
        //    本轮已同步给 SettingsActivity 接上 WindowInsets（见 setContentView 之后那段），
        //    两者必须同批上线：只升 targetSdk 而不接 insets，页头会被状态栏压住。
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }

    // ── 签名方案（【code 1025】Ari 指令：V1 + V2 + V3 全开）──────────────────
    // 现状取证（对 code 1024 交付包跑 apksigner verify -v）：
    //   Verified using v1 scheme (JAR signing): false
    //   Verified using v2 scheme (APK Signature Scheme v2): true
    //   Verified using v3 scheme (APK Signature Scheme v3): false
    // 即「只有 v2」。
    //
    // ⚠️ 为什么必须显式写 v1：AGP 在 minSdk ≥ 24 时**默认关闭 v1**
    //    （那本是「只有 API < 24 才需要」的优化），所以光升级 AGP 不会自己变三档。
    // ⚠️ 属性名是**混合**的（AGP 8.13 实测，写错会在配置阶段直接报
    //    "Could not find method v3SigningEnabled()"）：
    //      v1 / v2 → 老名字 `vXSigningEnabled`
    //      v3      → 新名字 `enableV3Signing`
    //    只写新名字那套时，本机实测产出的包**仍然没有 JAR 签名**：
    //    `signing-config-versions.json` 里 enableV1Signing=true，但 APK 内无
    //    META-INF/*.SF，apksigner 报 `v1: false` ⇒ 打包链路读的是老字段。
    // ⚠️ 只改 `debug` 这一个 signingConfig：本模块的交付包一直是 debug 签名
    //    （无 release keystore，见 docs/build.md），不引入新密钥 = 不影响覆盖安装。
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            // 沿用 debug 签名（storeFile / 口令由 AGP 指向 ~/.android/debug.keystore）；
            // 【code 1025】显式绑定，避免「signingConfigs.debug 改了、buildType 用的却是另一份」。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 需要 BuildConfig.APPLICATION_ID / VERSION_NAME 打进日志
        buildConfig true
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// 让 APK 产物文件名带上「版本 + versionCode + 构建类型」。
// ⚠️【2026-10-04 Ari 指令】**文件名必须标出 versionCode** —— 历史上 2.1.3 出现过两个
//    不同的 code（955 / 958）、2.1.5 与「2.1.3 修复」也复用过同一个 958，光看
//    「DLsiteFloat-2.1.3-debug.apk」根本分不清装的是哪一版，返工时对不上号。
//    现在统一 DLsiteFloat-<versionName>-code<versionCode>-<buildType>.apk，
//    与工作区根目录的历史交付包命名（DLsiteFloat-2.1.4-code957-debug.apk）对齐。
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                    "DLsiteFloat-${appVersionTag}-code${appVersionCode}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    // libxposed 现代 API（API 102）。compileOnly：API 由框架在运行时提供，不打进 APK。
    // ⚠️ 只能 compileOnly —— 打进包会导致模块与框架的 XposedInterface 类冲突。
    compileOnly 'io.github.libxposed:api:102.0.0'

    // ── 【M1】可视化设置页（PRD §7 / NFR-01）──────────────────────────────
    // 设置页是本模块**自己进程内**的独立 Activity（SettingsActivity），需要 MD3 组件。
    // ⚠️ 用 implementation（不是 compileOnly）：这些类要打进本模块 APK 供设置页使用。
    //    注入到宿主 / SystemUI 的视图（FloatingSubtitleView 等）一律用**代码构建**
    //    且不引用本模块资源 / 不依赖 Material（见 FloatingSubtitleView 类头），
    //    所以下游进程不会因为缺这些类而崩。
    // ⚠️ 首次构建需联网拉取（本机 toolchain/maven-local 里没有 androidx 制品）。
    // ── 【code 1025】1.9.0 → 1.14.0 ────────────────────────────────────────
    // 升它的**唯一动机**：M3 Expressive 的官方组件自 1.13 才进 material
    // （Expressive 滑块 / 按钮组 / 分段按钮那一族）。本页此前的 M3E 观感全是手搓的
    // （见 SettingsActivity#applyExpressiveSlider），升库后才有「官方形态」可选。
    // ⚠️ material 1.14.0 的 POM 要求 appcompat 1.7.0 / core 1.16.0 / activity 1.8.0，
    //    这里**显式钉死**前两个：不钉的话由传递依赖决定版本，构建不可复现
    //    （下次谁改了传递链，包就悄悄变了，双闭环对照会假 FAIL）。
    // ⚠️ core 1.16.0 的 AAR metadata 要求 compileSdk ≥ 35 ⇒ 见上方的 compileSdk 36。
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.16.0'

    // ── 【code 995】纯函数内核的黄金向量回归测试 ───────────────────────────────
    // CapsuleGeometry / PageFollowPolicy / AnchorDeadPolicy 是从 ActivityButtonHook
    // （4700 行上帝类）抽出来的**纯判定层**，判据由 4~6 个阈值常量组合而成 ——
    // 改一个比较符就可能让「按钮提前消失」只在真机复现（v36 就是这种形状）。
    // 把真机实测值固化成 JUnit，让这类改动在**离线期**就被拦住。
    //
    // ⚠️ junit 是 testImplementation，**不进 APK**，不影响包体。
    // ⚠️ 制品已预置到 toolchain/maven-local（junit 4.13.2 + hamcrest-core 1.3），
    //    所以 --offline 构建照样能跑，不会临时去探网。
    testImplementation 'junit:junit:4.13.2'
}
