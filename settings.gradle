pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // 可选：本地离线 Maven 副本（io.github.libxposed:api:102.0.0 等）。
        // 仓库里**不写任何绝对路径** —— 只在本地确实存在时才加入，或用环境变量
        // DLSITEFLOAT_MAVEN_LOCAL 指到别处。放在最前，避免离线时先去 mavenCentral 探网。
        def _offlineMaven = System.getenv('DLSITEFLOAT_MAVEN_LOCAL')
                ? new File(System.getenv('DLSITEFLOAT_MAVEN_LOCAL'))
                : new File(rootDir, 'toolchain/maven-local')
        if (_offlineMaven.isDirectory()) {
            maven { url _offlineMaven.toURI() }
        }
        google()
        // mavenCentral 提供 io.github.libxposed:api:102.0.0（2.0.0 起的唯一依赖）。
        mavenCentral()
        // 传统 Xposed API 的仓库（de.robv.android.xposed:api:82）：2.0.0 已不再使用，
        // 保留只为「万一要临时回退到 1.21.x 分支比对」时不用改构建脚本。离线构建不受影响。
        maven { url 'https://api.xposed.info/' }
    }
}
rootProject.name = "DLsiteSound_FloatSubtitle"
include ':app'
